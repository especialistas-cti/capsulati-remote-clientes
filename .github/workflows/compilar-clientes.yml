# Compila as edições Capsula TI (Cliente e Técnico) do RustDesk para Windows e macOS.
# Os passos de compilação são os do workflow oficial do RustDesk 1.5.3
# (.github/workflows/flutter-build.yml), com a marca aplicada logo após o checkout
# e sem as etapas de assinatura/publicação da RustDesk.
#
# Antes de rodar, cadastre em Settings > Secrets and variables > Actions > Variables:
#   RUSTDESK_HOST  nome ou IP público do servidor hbbs/hbbr
#   RUSTDESK_KEY   conteúdo de /opt/capsulati-remote/data/id_ed25519.pub
name: Compilar clientes Capsula TI

on:
  workflow_dispatch:
    inputs:
      edicao:
        description: "Edição"
        type: choice
        options: [ambas, cliente, tecnico]
        default: ambas
      plataforma:
        description: "Plataforma"
        type: choice
        options: [ambas, windows, macos]
        default: ambas
      publicar:
        description: "Criar uma release com os instaladores"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: compilar-clientes
  cancel-in-progress: false

env:
  RUSTDESK_TAG: "1.5.3"
  VERSION: "1.5.3"
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_MACOS_ARM_VERSION: "3.44.9"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"

jobs:
  preparar:
    name: Validar configuração e marca
    runs-on: ubuntu-22.04
    outputs:
      edicoes: ${{ steps.matriz.outputs.edicoes }}
      windows: ${{ steps.matriz.outputs.windows }}
      macos: ${{ steps.matriz.outputs.macos }}
    steps:
      - name: Checkout do RustDesk ${{ env.RUSTDESK_TAG }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.RUSTDESK_TAG }}
          submodules: recursive

      - name: Checkout da marca Capsula TI
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: capsulati

      - name: Conferir que a marca aplica nas duas edições
        env:
          RUSTDESK_HOST: ${{ vars.RUSTDESK_HOST }}
          RUSTDESK_KEY: ${{ vars.RUSTDESK_KEY }}
        run: |
          set -e
          for edicao in cliente tecnico; do
            python3 capsulati/scripts/aplicar_marca.py --edicao "$edicao" --plataforma todas
            git checkout -- . && git clean -fdq -e capsulati
            git submodule foreach --quiet 'git checkout -- . && git clean -fdq'
          done

      - name: Montar matriz
        id: matriz
        run: |
          case "${{ inputs.edicao }}" in
            ambas) echo 'edicoes=["cliente","tecnico"]' >> "$GITHUB_OUTPUT" ;;
            *) echo 'edicoes=["${{ inputs.edicao }}"]' >> "$GITHUB_OUTPUT" ;;
          esac
          [[ "${{ inputs.plataforma }}" != macos ]] && echo windows=true >> "$GITHUB_OUTPUT" || echo windows=false >> "$GITHUB_OUTPUT"
          [[ "${{ inputs.plataforma }}" != windows ]] && echo macos=true >> "$GITHUB_OUTPUT" || echo macos=false >> "$GITHUB_OUTPUT"

  ponte:
    # Mesmo job do bridge.yml oficial, com checkout da tag do RustDesk.
    name: Ponte Flutter-Rust (${{ matrix.job.flutter-version }})
    needs: preparar
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { flutter-version: "3.22.3", artifact-name: "bridge-artifact" }
          - { flutter-version: "3.44.8", artifact-name: "bridge-artifact-flutter-3.44" }
    steps:
      - name: Checkout do RustDesk
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.RUSTDESK_TAG }}
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge-ubuntu-22.04

      - name: Cache Bridge
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: /tmp/flutter_rust_bridge
          key: bridge-${{ matrix.job.flutter-version }}

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.flutter-version }}
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          if [[ "${{ matrix.job.flutter-version }}" == "3.22.3" ]]; then
            sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          else
            bash .github/patches/apply_flutter_3.44_source_patches.sh
          fi
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.job.artifact-name }}
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  janela-topo:
    name: RustDeskTempTopMostWindow (x64)
    needs: preparar
    if: needs.preparar.outputs.windows == 'true'
    uses: rustdesk/rustdesk/.github/workflows/third-party-RustDeskTempTopMostWindow.yml@1.5.3
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  windows:
    name: Windows x64 - ${{ matrix.edicao }}
    needs: [preparar, ponte, janela-topo]
    if: needs.preparar.outputs.windows == 'true'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        edicao: ${{ fromJSON(needs.preparar.outputs.edicoes) }}
    env:
      TARGET: x86_64-pc-windows-msvc
      VCPKG_TRIPLET: x64-windows-static
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout do RustDesk ${{ env.RUSTDESK_TAG }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.RUSTDESK_TAG }}
          submodules: recursive

      - name: Checkout da marca Capsula TI
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: capsulati

      - name: Aplicar marca Capsula TI (${{ matrix.edicao }})
        env:
          RUSTDESK_HOST: ${{ vars.RUSTDESK_HOST }}
          RUSTDESK_KEY: ${{ vars.RUSTDESK_KEY }}
        run: python capsulati/scripts/aplicar_marca.py --edicao ${{ matrix.edicao }} --plataforma windows

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ env.TARGET }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet ${{ env.VCPKG_TRIPLET }} --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do echo "$_1:"; cat "$_1"; done
            exit 1
          fi

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums
            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
              Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
              mkdir ./rustdesk/drivers
              mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
              Expand-Archive printer_driver_adapter.zip -DestinationPath .
              mv -Force .\printer_driver_adapter.dll ./rustdesk
            } else {
              Write-Output "Printer driver checksums do not match, ignoring."
            }
          } catch {
            Write-Host "Ignoring the printer driver error."
          }

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res" | head -1)
          if [ -n "$runner_res" ]; then cp "$runner_res" ./libs/portable/Runner.res; ls -l ./libs/portable/Runner.res; fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Renomear executável para ${{ env.CAPSULA_APP }}
        shell: pwsh
        run: |
          Move-Item ./rustdesk/rustdesk.exe "./rustdesk/$env:CAPSULA_APP.exe"
          $ver = (& "./rustdesk/$env:CAPSULA_APP.exe" --version | Out-String).Trim()
          Write-Host "Versão informada pelo executável: $ver"

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/${CAPSULA_APP}.exe"
          popd
          mkdir -p ./SaidaCapsula
          mv ./target/release/rustdesk-portable-packer.exe "./SaidaCapsula/${CAPSULA_APP}-${VERSION}-x86_64.exe"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          msbuild-architecture: x86

      - name: Build msi
        run: |
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk --app-name "$env:CAPSULA_APP" --conn-type "$env:CAPSULA_CONN_TYPE" -m "$env:CAPSULA_EMPRESA"
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          mv $msi.FullName "../../SaidaCapsula/$env:CAPSULA_APP-$env:VERSION-x86_64.msi"
          popd

      - name: Somas SHA256
        shell: bash
        run: cd SaidaCapsula && sha256sum * | tee "SHA256-${CAPSULA_APP}-windows.txt"

      - name: Enviar instaladores
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capsulati-${{ matrix.edicao }}-windows-x86_64
          path: ./SaidaCapsula/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.job.arch }} - ${{ matrix.edicao }}
    needs: [preparar, ponte]
    if: needs.preparar.outputs.macos == 'true'
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        edicao: ${{ fromJSON(needs.preparar.outputs.edicoes) }}
        job:
          - { target: x86_64-apple-darwin, os: macos-15-intel, extra-build-args: "", arch: x86_64, vcpkg-triplet: x64-osx }
          - { target: aarch64-apple-darwin, os: macos-15, extra-build-args: "--screencapturekit", arch: aarch64, vcpkg-triplet: arm64-osx }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout do RustDesk ${{ env.RUSTDESK_TAG }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.RUSTDESK_TAG }}
          submodules: recursive

      - name: Checkout da marca Capsula TI
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: capsulati

      - name: Aplicar marca Capsula TI (${{ matrix.edicao }})
        env:
          RUSTDESK_HOST: ${{ vars.RUSTDESK_HOST }}
          RUSTDESK_KEY: ${{ vars.RUSTDESK_KEY }}
        run: python3 capsulati/scripts/aplicar_marca.py --edicao ${{ matrix.edicao }} --plataforma macos

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          if command -v pkg-config &>/dev/null; then echo "pkg-config is already installed"; else brew install pkg-config; fi

      - name: Install NASM
        run: |
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_MACOS_ARM_VERSION || env.FLUTTER_VERSION }}

      - name: Keep CocoaPods for Flutter 3.44 (arm64)
        if: ${{ matrix.job.arch == 'aarch64' }}
        run: flutter config --no-enable-swift-package-manager

      - name: Patch flutter
        if: ${{ matrix.job.arch == 'x86_64' }}
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Patch RustDesk sources for Flutter 3.44 (arm64)
        if: ${{ matrix.job.arch == 'aarch64' }}
        shell: bash
        run: |
          brew install gnu-sed
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' || 'bridge-artifact' }}
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do echo "$_1:"; cat "$_1"; done
            exit 1
          fi

      - name: Build rustdesk
        run: |
          if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
            echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}" >> "$GITHUB_ENV"
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      - name: Empacotar ${{ env.CAPSULA_APP }} (.dmg)
        run: bash capsulati/scripts/empacotar_macos.sh "$CAPSULA_APP" "$CAPSULA_NOME" "$CAPSULA_BUNDLE_ID" "$VERSION" "${{ matrix.job.arch }}"

      - name: Somas SHA256
        run: cd SaidaCapsula && shasum -a 256 * | tee "SHA256-${CAPSULA_APP}-macos-${{ matrix.job.arch }}.txt"

      - name: Enviar instalador
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capsulati-${{ matrix.edicao }}-macos-${{ matrix.job.arch }}
          path: ./SaidaCapsula/*
          if-no-files-found: error

  publicar:
    name: Publicar release
    needs: [preparar, windows, macos]
    if: ${{ always() && inputs.publicar && needs.preparar.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar instaladores
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: capsulati-*
          path: instaladores
          merge-multiple: true

      - name: Listar
        run: ls -la instaladores

      - name: Criar release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: v${{ env.VERSION }}-capsulati.${{ github.run_number }}
          name: Capsula TI Remote - clientes ${{ env.VERSION }} (build ${{ github.run_number }})
          prerelease: true
          body: |
            Clientes Capsula TI baseados no RustDesk ${{ env.VERSION }} (AGPL-3.0).
            Edição: ${{ inputs.edicao }} · Plataforma: ${{ inputs.plataforma }}.

            - **Capsula TI Suporte** (`CapsulaTI-Suporte`): instalar nos computadores atendidos. Só recebe conexões.
            - **Capsula TI Remote** (`CapsulaTI-Remote`): uso da equipe técnica. Só inicia conexões.

            Sem assinatura de código: o Windows mostra o aviso do SmartScreen ("Mais informações > Executar assim mesmo")
            e o macOS exige liberar em Ajustes > Privacidade e Segurança > "Abrir mesmo assim".
            O código-fonte correspondente é o RustDesk ${{ env.VERSION }} com as alterações deste repositório.
          files: instaladores/*
